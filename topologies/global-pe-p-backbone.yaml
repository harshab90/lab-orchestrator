# Topology: 4 PE routers (Seattle, Raleigh, India, London), 2 P
# routers (Dallas, Singapore) — matches the whiteboard diagram.
#
# underlay: bgp-lu — NO IS-IS. Dallas and Singapore are BGP Route
# Reflectors; every physical link (single link or port-channel) is a
# separate BGP-LU (RFC 8277) session in address-family ipv4
# labeled-unicast. The PE-to-PE overlay mesh (loopback-based, carries
# customer prefixes) is unchanged from the IS-IS version — it just
# resolves recursively through the BGP-LU labeled routes instead of
# an IGP+SR underlay. See README "Underlay modes" for the reasoning.
#
# Every major hop (Seattle-Dallas, Raleigh-Dallas, Dallas-Singapore,
# Singapore-India, Singapore-London, Raleigh-London) is THREE
# independent port-channels, each bundling 5 members (5x800G in
# production; scaled down to plain veth links here since the lab
# tests protocol behavior, not bandwidth) — each port-channel becomes
# its own separate BGP-LU session, giving 3-way ECMP at the routing
# level between adjacent nodes.
#
# Seattle-Raleigh is a single direct link (no bundling) — a local,
# lower-capacity backup path between the two US PEs.
# Raleigh-London is a direct shortcut bypassing the Dallas/Singapore
# core entirely — kept as a real path specifically so the WAN
# traffic-management layer (Gold/Silver/Bronze CBTS, built later) has
# genuine alternate routes to steer between.

name: global-pe-p-backbone
underlay: bgp-lu

image: ceos:4.32.0F

nodes:
  seattle:
    role: pe
    loopback0: 10.0.0.1/32
    bgp_as: 65000
    customer_prefixes: [1.0.0.0/16, 2.0.0.0/16, 3.0.0.0/16]

  raleigh:
    role: pe
    loopback0: 10.0.0.2/32
    bgp_as: 65000
    customer_prefixes: [10.0.0.0/16, 20.0.0.0/16, 30.0.0.0/16]

  india:
    role: pe
    loopback0: 10.0.0.3/32
    bgp_as: 65000
    customer_prefixes: [110.0.0.0/16, 120.0.0.0/16, 130.0.0.0/16]

  london:
    role: pe
    loopback0: 10.0.0.4/32
    bgp_as: 65000
    customer_prefixes: [210.0.0.0/16, 220.0.0.0/16, 230.0.0.0/16]

  dallas:
    role: p
    loopback0: 10.0.0.11/32
    bgp_as: 65000
    route_reflector: true

  singapore:
    role: p
    loopback0: 10.0.0.12/32
    bgp_as: 65000
    route_reflector: true

# Plain point-to-point links (not bundled).
single_links:
  - {a: seattle, b: raleigh, subnet: 10.2.1.0/31}

# Port-channel bundles. Multiple entries between the same pair of
# nodes = multiple independent port-channels (each gets its own
# Port-Channel ID and its own BGP-LU session, since peering happens
# on the logical Port-Channel address).
# `members: 5` = 5 physical links per port-channel; lower this to 1-2
# if 90 veth pairs is more than you want to wire on a first run — the
# generated config still forms a real (smaller) LAG either way.
bundles:
  - {a: seattle,    b: dallas,    members: 5, subnet: 10.3.1.0/31}
  - {a: seattle,    b: dallas,    members: 5, subnet: 10.3.2.0/31}
  - {a: seattle,    b: dallas,    members: 5, subnet: 10.3.3.0/31}

  - {a: raleigh,    b: dallas,    members: 5, subnet: 10.3.4.0/31}
  - {a: raleigh,    b: dallas,    members: 5, subnet: 10.3.5.0/31}
  - {a: raleigh,    b: dallas,    members: 5, subnet: 10.3.6.0/31}

  - {a: dallas,     b: singapore, members: 5, subnet: 10.3.7.0/31}
  - {a: dallas,     b: singapore, members: 5, subnet: 10.3.8.0/31}
  - {a: dallas,     b: singapore, members: 5, subnet: 10.3.9.0/31}

  - {a: singapore,  b: india,     members: 5, subnet: 10.3.10.0/31}
  - {a: singapore,  b: india,     members: 5, subnet: 10.3.11.0/31}
  - {a: singapore,  b: india,     members: 5, subnet: 10.3.12.0/31}

  - {a: singapore,  b: london,    members: 5, subnet: 10.3.13.0/31}
  - {a: singapore,  b: london,    members: 5, subnet: 10.3.14.0/31}
  - {a: singapore,  b: london,    members: 5, subnet: 10.3.15.0/31}

  - {a: raleigh,    b: london,    members: 5, subnet: 10.3.16.0/31}
  - {a: raleigh,    b: london,    members: 5, subnet: 10.3.17.0/31}
  - {a: raleigh,    b: london,    members: 5, subnet: 10.3.18.0/31}
